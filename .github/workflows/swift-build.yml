name: Swift Build and Debug Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Premium App
      run: |
        xcodebuild -workspace airsync-mac.xcworkspace -scheme "AirSync Self Compiled" -configuration Release -derivedDataPath BuildData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO clean build | xcpretty

    - name: Stage Executable Bundle
      run: |
        mkdir -p final_delivery
        cp -R BuildData/Build/Products/Release/AirSync.app final_delivery/AirSync.app

    - name: Upload Premium App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Premium-Unlocked
        path: final_delivery/AirSync.app
