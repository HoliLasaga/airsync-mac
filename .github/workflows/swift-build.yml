name: Swift Build and Debug Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Compile and Archive App
      run: |
        xcodebuild archive -archivePath $PWD/AirSync.xcarchive -scheme "AirSync Self Compiled" -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

    - name: Extract Standalone App Bundle
      run: |
        mkdir -p final_app
        cp -R AirSync.xcarchive/Products/Applications/AirSync.app final_app/AirSync.app

    - name: Upload Premium App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Premium-Unlocked
        path: final_app/AirSync.app
