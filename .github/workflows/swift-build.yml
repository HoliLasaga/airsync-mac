name: Swift Build and Debug Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Premium App
      run: |
        xcodebuild -scheme "AirSync Self Compiled" -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO clean build | xcpretty

    - name: Package App Bundle Directly
      run: |
        mkdir -p deploy
        zip -r deploy/AirSync-Premium.zip ./ -i "*.app*" 2>/dev/null || true
        cp -R $(find . -name "AirSync.app" -type d | head -n 1) deploy/ 2>/dev/null || true

    - name: Upload Premium App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Premium-Unlocked
        path: deploy/
