name: Swift Build and Debug Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Build Premium App
      run: |
        xcodebuild -scheme "AirSync Self Compiled" -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO clean build | xcpretty

    - name: Locate and Package App
      run: |
        mkdir -p packed_app
        # This scans the system, finds the built binary, and copies it out safely
        find ~/Library/Developer/Xcode/DerivedData -name "AirSync.app" -type d -exec cp -R {} packed_app/ \; 2>/dev/null || true
        find . -name "AirSync.app" -type d -exec cp -R {} packed_app/ \; 2>/dev/null || true

    - name: Upload Premium App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AirSync-Premium-Unlocked
        path: packed_app/AirSync.app
